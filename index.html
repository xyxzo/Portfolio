<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Deity | Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --champagne: #e6c88f;
      --text-muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      font-family: "Inter", system-ui, sans-serif;
      background:
        radial-gradient(circle at 0% 0%, rgba(230, 200, 143, 0.12) 0, transparent 55%),
        radial-gradient(circle at 100% 0%, rgba(255, 255, 255, 0.04) 0, transparent 55%),
        radial-gradient(circle at 0% 100%, rgba(148, 163, 184, 0.25) 0, transparent 55%),
        radial-gradient(circle at 100% 100%, rgba(0, 0, 0, 0.9) 0, #050509 55%);
      color: #e5e7eb;
      -webkit-font-smoothing: antialiased;
    }

    .navbar-wrapper {
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .navbar {
      max-width: 1120px;
      margin: 0 auto;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      background: rgba(0, 0, 0, 0.6);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .brand {
      font-family: "Playfair Display", serif;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-size: 1rem;
      color: var(--champagne);
    }

    .nav-links {
      display: flex;
      gap: 24px;
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #e5e7eb;
    }

    .nav-links a {
      text-decoration: none;
      position: relative;
      padding-bottom: 4px;
      transition: color 0.3s ease;
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 1px;
      background: var(--champagne);
      transition: width 0.3s ease;
    }

    .nav-links a:hover {
      color: var(--champagne);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 96px 16px 56px;
      display: flex;
      flex-direction: column;
      gap: 120px;
    }

    section {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    section.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .section-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .section-title {
      font-family: "Playfair Display", serif;
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    @media (max-width: 640px) {
      main { gap: 80px; padding-top: 80px; }
      .nav-links { font-size: 0.7rem; gap: 16px; }
    }
  </style>
</head>
<body>
  <!-- Sticky Nav -->
  <div class="navbar-wrapper">
    <header class="navbar">
      <div class="brand">Deity</div>
      <nav class="nav-links">
        <a href="#hero">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>
  </div>

  <main>
    <!-- Hero (blank content zone) -->
    <section id="hero">
      <p class="section-label">Hero</p>
      <h1 class="section-title">Your main headline here.</h1>
      <p>Add your hero content.</p>
    </section>

    <!-- About (blank content zone) -->
    <section id="about">
      <p class="section-label">About</p>
      <h2 class="section-title">About you.</h2>
      <p>Add your about text here.</p>
    </section>

    <!-- Contact (blank content zone) -->
    <section id="contact">
      <p class="section-label">Contact</p>
      <h2 class="section-title">Reach out.</h2>
      <p>Add email, social links, etc.</p>
    </section>
  </main>

  <script>
    // Fade-in on scroll
    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("visible");
            observer.unobserve(entry.target);
          }
        });
      },
      { threshold: 0.18 }
    );

    document.querySelectorAll("main section").forEach((section) => {
      observer.observe(section);
    });
  </script>
</body>
</html>
